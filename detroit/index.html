<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="tdm-reservation" content="1">
<meta name="robots" content="noai, noimageai">
<title>What's happening in Detroit · Billd</title>
<meta name="description" content="This week in Detroit: music, film, comedy, sports, markets and happy hours, day by day, each with a link to its listing.">
<meta name="theme-color" content="#4a0f1c">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Oswald:wght@500;700&display=swap">
<link rel="stylesheet" href="../app.css">
<script src="../theme.js"></script>
<style>
/* The week in Detroit, set like the rest of Billd: programme paper, velvet day bands, brass rules.
   One narrow reading column: venue | event | time rows under a banded header for each day. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {   /* the system's dark mode, unless the visitor chose light on Billd */
  --bg: #1f171a; --surface: #2b2125; --raise: #372b30; --line: #4b3d43; --line-soft: #3a2e33;
  --ink: #fbf4ea; --muted: #c8bcb1; --faint: #a99b90; --gold: #f0c35a; --gold-ink: #24170a;
  --brass: #c79a45; --head: #f3d9a4; --velvet: #3a0b16; color-scheme: dark;
} }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.5 var(--font-ui); margin: 0; -webkit-font-smoothing: antialiased; }
.dt { max-width: 860px; margin: 0 auto; padding: 22px 16px 64px; }
.dt-mast { display: grid; gap: 6px; padding-bottom: 16px; }
.dt-back { color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; justify-self: start; }
.dt-back:hover { color: var(--gold); }
.dt-eyebrow { font: 500 12.5px/1.2 var(--font-bill); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.dt-mast h1 { margin: 0; font: 800 clamp(32px, 6.5vw, 52px)/1.02 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.dt-mast h1 em { color: var(--gold); }
.dt-sub { margin: 0; color: var(--muted); }
.dt-sub b { color: var(--ink); font-weight: 600; }

.dt-nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line-soft); display: grid; gap: 10px; }
.dt-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.dt-chips::-webkit-scrollbar { display: none; }
.dt-chips .chip { flex: none; cursor: pointer; background: var(--surface); color: var(--ink); font: 600 13.5px/1 var(--font-ui); min-height: 36px; }
.dt-chips .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.dt-chips .chip.today:not([aria-pressed="true"]) { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.dt-chips .chip[aria-pressed="true"] small { color: var(--gold-ink); opacity: 0.8; }
#dt-q { width: 100%; font: 15px var(--font-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }

.dt-block { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.dt-band { background: var(--velvet); color: #f3e2c4; border-bottom: 2px solid var(--brass); padding: 9px 14px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dt-band h2 { margin: 0; font: 700 21px/1.1 var(--font-display); font-style: italic; }
.dt-band span { font: 500 12px/1 var(--font-bill); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; }
.dt-band .now { background: var(--brass); color: #24170a; padding: 4px 8px; border-radius: 4px; opacity: 1; }
ol.dt-rows { list-style: none; margin: 0; padding: 0; }
.dt-row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) auto; gap: 4px 18px; padding: 11px 14px; border-top: 1px solid var(--line-soft); align-items: baseline; }
.dt-row:first-child { border-top: 0; }
.dt-venue { font-weight: 600; min-width: 0; }
.dt-venue .at { color: var(--muted); font-weight: 400; }
.dt-what { min-width: 0; }
.dt-what a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.dt-what a:hover { text-decoration-color: var(--gold); color: var(--gold); }
.dt-when { font: 500 13.5px var(--font-ui); color: var(--gold); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dt-tag { font: 500 10.5px/1 var(--font-bill); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 2px 4px; vertical-align: 2px; white-space: nowrap; }
.dt-subh { font: 500 12.5px var(--font-bill); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 12px 14px 4px; }
.dt-subh + ol .dt-row:first-child { border-top: 0; }
.dt mark { background: color-mix(in srgb, var(--brass) 30%, transparent); color: inherit; border-radius: 2px; }
.dt-empty { padding: 14px; color: var(--muted); margin: 0; }
.dt-note { margin-top: 22px; padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }
.dt-foot { margin-top: 32px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; }
@media (max-width: 620px) {
  .top .nav { display: none; }
  .dt-row { grid-template-columns: minmax(0, 1fr) auto; }
  .dt-venue { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-weight: 500; }
  .dt-when { white-space: normal; max-width: 9.5rem; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<a class="skip" href="#dt-main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="logo" href="../" aria-label="Billd home"><span class="logo-mark" aria-hidden="true">B</span><span class="logo-word">Billd</span></a>
    <nav class="nav" aria-label="Main">
      <a href="../#/browse">Shows</a>
      <a href="../#/onstage">On stage</a>
      <a href="../#/lists">Lists</a>
      <a href="../#/members">Members</a>
      <a href="../#/activity">Activity</a>
    </nav>
  </div>
</header>

<div class="dt">
  <header class="dt-mast">
    <a class="dt-back" href="../">← Billd</a>
    <div class="dt-eyebrow">Music · Film · Comedy · Sports</div>
    <h1>This week in <em>Detroit</em></h1>
    <p class="dt-sub" id="dt-range"></p>
  </header>

  <nav class="dt-nav" aria-label="Choose a day">
    <div class="dt-chips" id="dt-chips" role="toolbar"></div>
    <input id="dt-q" type="search" placeholder="Search venues and events — e.g. Fox, jazz, Pistons" autocomplete="off" aria-label="Search this week's listings">
  </nav>

  <main id="dt-main" tabindex="-1"><p class="dt-note">Loading this week's listings…</p></main>

  <footer class="dt-foot">
    <div id="dt-count"></div>
    <div>Times change; confirm with the venue before heading out. Tap an event to see where the listing came from.</div>
  </footer>
</div>
<script src="detroit.js"></script>
</body>
</html>
